<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bundle Wise Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12263a">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="admin">
<div id="boot" class="boot">Loading…</div>

<div id="auth" hidden></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="images/logo.png" alt="Bundle Wise" class="logo"></div>
    <div class="who"><span id="whoName"></span><span class="role" id="roleBadge"></span><button data-act="logout">Logout</button></div>
  </header>
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <nav class="bottom" id="bottom"></nav>
</div>
<div id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
